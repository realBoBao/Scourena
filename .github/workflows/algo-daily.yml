name: Daily Algo

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  algo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm install --legacy-peer-deps --ignore-scripts
      - name: Skip when webhook is not configured
        if: ${{ secrets.ALGO_WEBHOOK_URL == '' }}
        run: echo "ALGO_WEBHOOK_URL is not configured; skipping daily algo send."
      - name: Send daily algorithm problem
        if: ${{ secrets.ALGO_WEBHOOK_URL != '' }}
        env:
          ALGO_WEBHOOK_URL: ${{ secrets.ALGO_WEBHOOK_URL }}
        run: node cron/algo_webhook.js daily
