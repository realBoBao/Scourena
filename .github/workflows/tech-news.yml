name: Tech News

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"
    - cron: "0 0 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: Topic (blank means random)
        required: false
        default: ""

jobs:
  tech-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm install --legacy-peer-deps --ignore-scripts
      - name: Send tech news
        env:
          TECH_WEBHOOK_URL: ${{ secrets.TECH_WEBHOOK_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node cron/tech_news_webhook.js "${{ github.event.inputs.topic || '' }}"
